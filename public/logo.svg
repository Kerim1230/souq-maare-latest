<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0"/>
    </linearGradient>
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#b45309" flood-opacity="0.4"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>
  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="200" fill="url(#innerGlow)"/>
  <!-- Golden decorative border -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>
  <rect x="44" y="44" width="424" height="424" rx="72" ry="72" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.35"/>
  <!-- Arabic letter ش (Shin) - modern bold style with gold outline -->
  <text x="256" y="310" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="middle" filter="url(#goldShadow)">ش</text>
  <text x="256" y="310" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" style="filter: drop-shadow(0 4px 16px rgba(0,0,0,0.2));">ش</text>
  <!-- Small shopping icons around the letter -->
  <!-- Shopping cart icon (top-left) -->
  <g transform="translate(105, 115) scale(0.8)" filter="url(#iconShadow)" opacity="0.9">
    <path d="M10 20h24l4-16H6M6 4L4 0H0M10 28a2 2 0 100-4 2 2 0 000 4zM30 28a2 2 0 100-4 2 2 0 000 4z" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Tag/price icon (top-right) -->
  <g transform="translate(370, 110) scale(0.8)" filter="url(#iconShadow)" opacity="0.9">
    <path d="M20 4L36 20L20 36L4 20L20 4zM18 16a2 2 0 100-4 2 2 0 000 4z" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Store icon (bottom-left) -->
  <g transform="translate(100, 370) scale(0.8)" filter="url(#iconShadow)" opacity="0.9">
    <path d="M4 20h32v16H4zM8 20V12l12-8 12 8v8M12 28h8M16 20v16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Star/featured icon (bottom-right) -->
  <g transform="translate(375, 375) scale(0.8)" filter="url(#iconShadow)" opacity="0.85">
    <path d="M20 4l4.5 10 11 1.5-8 7.5 2 11L20 29l-9.5 5 2-11-8-7.5 11-1.5z" fill="url(#goldGrad)" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
