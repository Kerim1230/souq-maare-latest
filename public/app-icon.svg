<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="50%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#92400e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Main circle with gradient -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGrad)" filter="url(#goldGlow)"/>

  <!-- Shine overlay -->
  <ellipse cx="256" cy="180" rx="180" ry="140" fill="url(#shineGrad)" opacity="0.5"/>

  <!-- Golden border ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Arabic letter ش (Shin) - large bold white -->
  <text x="256" y="285" font-family="'Cairo', 'Noto Sans Arabic', 'Arial', sans-serif" font-size="230" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" filter="url(#letterShadow)" letter-spacing="-5">ش</text>

  <!-- Small category icons around the letter -->
  <!-- Phone (top-left) -->
  <g transform="translate(110, 110)" filter="url(#iconGlow)" opacity="0.9">
    <rect x="4" y="2" width="20" height="32" rx="4" fill="none" stroke="white" stroke-width="2.2"/>
    <line x1="10" y1="28" x2="18" y2="28" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Shirt (top-right) -->
  <g transform="translate(365, 105)" filter="url(#iconGlow)" opacity="0.9">
    <path d="M4 12L12 4L20 12M4 12V30C4 31 5 32 6 32H18C19 32 20 31 20 30V12M4 12L0 16M20 12L24 16" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- House (left) -->
  <g transform="translate(75, 260)" filter="url(#iconGlow)" opacity="0.9">
    <path d="M4 18L16 6L28 18M6 16V30H26V16" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="13" y="20" width="6" height="10" fill="none" stroke="white" stroke-width="2" rx="1"/>
  </g>

  <!-- Car (right) -->
  <g transform="translate(370, 260)" filter="url(#iconGlow)" opacity="0.9">
    <path d="M2 22H6L10 14H22L26 22H30M6 22V26H2V22M30 22V26H26V22" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="9" cy="24" r="3" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="23" cy="24" r="3" fill="none" stroke="white" stroke-width="2"/>
  </g>

  <!-- Apple (bottom-left) -->
  <g transform="translate(115, 370)" filter="url(#iconGlow)" opacity="0.9">
    <path d="M16 6C12 2 6 4 4 10C2 16 4 26 12 30C14 31 16 30 16 30C16 30 18 31 20 30C28 26 30 16 28 10C26 4 20 2 16 6Z" fill="none" stroke="white" stroke-width="2.2"/>
    <path d="M16 6C16 6 18 0 22 2" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ring (bottom-right) -->
  <g transform="translate(365, 375)" filter="url(#iconGlow)" opacity="0.9">
    <ellipse cx="16" cy="18" rx="10" ry="10" fill="none" stroke="white" stroke-width="2.2"/>
    <path d="M10 4L16 10L22 4" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="4" r="3" fill="url(#goldGrad)" stroke="white" stroke-width="1"/>
  </g>
</svg>
